<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- Menu bar template glyph: only alpha matters. Slot split around an outlined cap,
       four ticks per side kept clear of the cap so it does not read as a gear. -->
