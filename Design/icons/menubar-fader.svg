    <rect x="1.5" y="2.4" width="3" height="1.2" rx="0.6"/>
    <rect x="1.5" y="5.2" width="2" height="1.2" rx="0.6"/>
    <rect x="1.5" y="11.6" width="2" height="1.2" rx="0.6"/>
    <rect x="1.5" y="14.4" width="3" height="1.2" rx="0.6"/>
    <rect x="13.5" y="2.4" width="3" height="1.2" rx="0.6"/>
    <rect x="14.5" y="5.2" width="2" height="1.2" rx="0.6"/>
    <rect x="14.5" y="11.6" width="2" height="1.2" rx="0.6"/>
    <rect x="13.5" y="14.4" width="3" height="1.2" rx="0.6"/>
    <rect x="8" y="1" width="2" height="5.6" rx="1"/>
    <rect x="8" y="11.4" width="2" height="5.6" rx="1"/>
  </g>
  <rect x="5.6" y="6.6" width="6.8" height="4.8" rx="1.6" fill="none" stroke="#000" stroke-width="1.2"/>
</svg>
